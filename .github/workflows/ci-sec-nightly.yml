name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '55 20 * * *'  # Runs every day at 20:55
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests with coverage
        run: mvn -B clean verify

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST) - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ------------------------------------------------------------------
  # 3. SAST - Semgrep (el reporte lo evalua el Quality Gate)
  # ------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Static Analysis - SpotBugs (+ FindSecBugs) y PMD
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs
        run: mvn -B -DskipTests compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - name: Run PMD
        continue-on-error: true
        run: mvn -B org.apache.maven.plugins:maven-pmd-plugin:pmd

      - name: Upload SpotBugs / PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # 5. Software Composition Analysis (SCA) - OWASP Dependency-Check
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # failBuildOnCVSS=11 nunca se alcanza: el job genera el reporte completo
      # y el Quality Gate decide si los hallazgos bloquean.
      - name: Run OWASP Dependency-Check
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=11

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 6. Quality Gate - lee los reportes y falla si hay hallazgos criticos
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-codeql, sast-semgrep, static-analysis, sca-dependency-check]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Check previous job results
        run: |
          echo "Build & Test:    ${{ needs.build-and-test.result }}"
          echo "CodeQL:          ${{ needs.sast-codeql.result }}"
          echo "Semgrep:         ${{ needs.sast-semgrep.result }}"
          echo "Static Analysis: ${{ needs.static-analysis.result }}"
          echo "SCA:             ${{ needs.sca-dependency-check.result }}"

          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::Build or tests failed"
            exit 1
          fi

          if [[ "${{ needs.sast-codeql.result }}" != "success" ]]; then
            echo "::error::CodeQL analysis failed"
            exit 1
          fi

      - name: Evaluate security reports
        if: always()
        run: python3 .github/scripts/quality_gate.py --reports reports --require semgrep,spotbugs,depcheck

      - name: Upload Quality Gate summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-summary
          path: quality-gate-summary.md
          if-no-files-found: warn
          retention-days: 14
